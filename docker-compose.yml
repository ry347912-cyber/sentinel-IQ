version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ztna-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ztna_db
    volumes:
      - mongo_data:/data/db
    networks:
      - ztna-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ztna-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ztna_db
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_super_secret_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_key}
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      BCRYPT_ROUNDS: 12
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ztna-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ztna-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ztna-network

volumes:
  mongo_data:
    driver: local

networks:
  ztna-network:
    driver: bridge
